<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>UsageLog - CSVアップロード</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">📊 UsageLog</a>
        <div class="navbar-nav">
          <a class="nav-link" href="/">メニュー</a>
          <a class="nav-link active" href="/upload">CSVアップロード</a>
          <a class="nav-link" href="/usage-search">明細検索</a>
          <a class="nav-link" href="/fixed-expense">固定費登録</a>
        </div>
      </div>
    </nav>

    <main class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
              <h1 class="h4 mb-0">CSVアップロード</h1>
            </div>
            <div class="card-body">
              <form
                id="uploadForm"
                method="post"
                enctype="multipart/form-data"
                th:action="@{/upload}"
              >
                <div class="mb-3">
                  <label class="form-label">カード会社</label>
                  <select name="source" class="form-select" required>
                    <option value="rakuten">楽天カード</option>
                    <option value="aeon">イオンカード</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label class="form-label">CSVファイル</label>
                  <input
                    type="file"
                    name="file"
                    accept=".csv"
                    class="form-control"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  📤 アップロード
                </button>
              </form>
            </div>
          </div>
          <div class="mt-3">
            <a href="/" class="btn btn-outline-secondary">メニューへ戻る</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
