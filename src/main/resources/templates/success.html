<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>UsageLog - アップロード完了</title>
    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>

  <body class="bg-light">
    <!-- ナビゲーションバー -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">📊 UsageLog</a>
        <div class="navbar-nav">
          <a class="nav-link" href="/">ホーム</a>
          <a class="nav-link" href="/usage-search">明細検索</a>
          <a class="nav-link" href="/fixed-expense">固定費登録</a>
        </div>
      </div>
    </nav>

    <!-- メインコンテンツ -->
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-sm border-success">
            <div class="card-header bg-success text-white">
              <h4 class="mb-0">✅ アップロード完了</h4>
            </div>
            <div class="card-body text-center py-5">
              <div class="mb-4">

                  class="bi bi-check-circle-fill text-success"

              <h5>CSVファイルのアップロードが完了しました！</h5>
              <p class="text-muted">データは正常にDBへ登録されました。</p>
              <div class="mt-4">
                <a th:href="@{/}" class="btn btn-primary">トップページへ戻る</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
