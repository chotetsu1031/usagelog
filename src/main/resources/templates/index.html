<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>UsageLog - メニュー</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>

  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">📊 UsageLog</a>
        <div class="navbar-nav">
          <a class="nav-link active" href="/">メニュー</a>
        </div>
      </div>
    </nav>

    <main class="container mt-5">
      <h1 class="mb-4 text-primary">メニュー</h1>
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h2 class="h5 card-title">📤 CSVアップロード</h2>
              <p class="card-text">カード利用明細のCSVを登録します。</p>
              <a href="/upload" class="btn btn-primary">画面を開く</a>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h2 class="h5 card-title">🔍 明細検索</h2>
              <p class="card-text">登録した利用明細を検索します。</p>
              <a href="/usage-search" class="btn btn-primary">画面を開く</a>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h2 class="h5 card-title">💰 固定費登録</h2>
              <p class="card-text">毎月の固定費を登録します。</p>
              <a href="/fixed-expense" class="btn btn-primary">画面を開く</a>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
