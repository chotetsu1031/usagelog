<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>UsageLog - 固定費用登録</title>
    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>

  <body class="bg-light">
    <!-- ナビゲーションバー -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">📊 UsageLog</a>
        <div class="navbar-nav">
          <a class="nav-link" href="/">ホーム</a>
          <a class="nav-link" href="/usage-search">明細検索</a>
          <a class="nav-link active" href="/fixed-expense">固定費登録</a>
        </div>
      </div>
    </nav>

    <!-- メインコンテンツ -->
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
              <h4 class="mb-0">💰 固定費用登録</h4>
            </div>
            <div class="card-body">
              <div
                th:if="${param.success}"
                class="alert alert-success"
                role="alert"
              >
                ✅ 登録が完了しました。
              </div>
              <form
                th:action="@{/fixed-expense}"
                method="post"
                th:object="${form}"
              >
                <div class="mb-3">
                  <label for="description" class="form-label">商品名</label>
                  <input
                    type="text"
                    id="description"
                    th:field="*{description}"
                    class="form-control"
                    placeholder="商品名を入力"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="amount" class="form-label">利用金額（円）</label>
                  <input
                    type="number"
                    id="amount"
                    th:field="*{amount}"
                    class="form-control"
                    placeholder="金額を入力"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="categoryCd" class="form-label">カテゴリ</label>
                  <select
                    id="categoryCd"
                    th:field="*{categoryCd}"
                    class="form-select"
                    required
                  >
                    <option value="">選択してください</option>
                    <option
                      th:each="category : ${categories}"
                      th:value="${category.categoryCd}"
                      th:text="${category.categoryName}"
                    ></option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="purchaseDate" class="form-label">利用日</label>
                  <input
                    type="date"
                    id="purchaseDate"
                    th:field="*{purchaseDate}"
                    class="form-control"
                    required
                  />
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  💾 保存
                </button>
              </form>
            </div>
          </div>
          <div class="mt-3">
            <a th:href="@{/}" class="btn btn-outline-secondary"
              >← トップページへ戻る</a
            >
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
